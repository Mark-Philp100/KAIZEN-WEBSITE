---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kaizpwij/public_html/

    - /bin/cp about.html $DEPLOYPATH
    - /bin/cp contact.html $DEPLOYPATH
    - /bin/cp home.html $DEPLOYPATH
    - /bin/cp work.html $DEPLOYPATH
    - /bin/cp robots.txt $DEPLOYPATH
    - /bin/cp sitemap.xml $DEPLOYPATH
    - /bin/cp sitemap.html $DEPLOYPATH
    - /bin/cp llms.txt $DEPLOYPATH

    # Shared navbar assets
    - /bin/cp projects-menu.css $DEPLOYPATH
    - /bin/cp projects-menu.js $DEPLOYPATH

    # Kaizen Chat microsite (exclude its nested Git metadata)
    - /bin/mkdir -p $DEPLOYPATH/Kaizen-Chat
    - /bin/cp Kaizen-Chat/index.html $DEPLOYPATH/Kaizen-Chat/
    - /bin/cp Kaizen-Chat/*.png $DEPLOYPATH/Kaizen-Chat/

    - /bin/cp *.webp $DEPLOYPATH
    - /bin/cp *.png $DEPLOYPATH
    - /bin/cp *.jpg $DEPLOYPATH

    # NEW LINE
    - /bin/cp -R Invitations $DEPLOYPATH
