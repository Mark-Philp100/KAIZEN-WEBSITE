---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kaizpwij/public_html/

    - /bin/cp about.html $DEPLOYPATH
    - /bin/cp contact.html $DEPLOYPATH
    - /bin/cp home.html $DEPLOYPATH
    - /bin/cp work.html $DEPLOYPATH
    - /bin/cp robots.txt $DEPLOYPATH
    - /bin/cp sitemap.xml $DEPLOYPATH
    - /bin/cp sitemap.html $DEPLOYPATH
    - /bin/cp llms.txt $DEPLOYPATH

    # Shared navbar assets
    - /bin/cp projects-menu.css $DEPLOYPATH
    - /bin/cp projects-menu.js $DEPLOYPATH

    # Kaizen Chat microsite
    - /bin/mkdir -p $DEPLOYPATH/Kaizen-Chat
    - /bin/cp Kaizen-Chat/index.html $DEPLOYPATH/Kaizen-Chat/
    - /bin/cp Kaizen-Chat/contact.php $DEPLOYPATH/Kaizen-Chat/
    - /bin/cp Kaizen-Chat/llms.txt $DEPLOYPATH/Kaizen-Chat/
    - /bin/cp Kaizen-Chat/k_chat_logo.png $DEPLOYPATH/Kaizen-Chat/
    - /bin/cp Kaizen-Chat/k_chat_logo_white.png $DEPLOYPATH/Kaizen-Chat/
    - /bin/cp Kaizen-Chat/kaizen_chat_logo.png $DEPLOYPATH/Kaizen-Chat/
    - /bin/cp Kaizen-Chat/kaizen_chat_logo_white.png $DEPLOYPATH/Kaizen-Chat/
    - /bin/cp "Kaizen-Chat/chat_footer (2).png" $DEPLOYPATH/Kaizen-Chat/
    - /bin/cp Kaizen-Chat/screen.png $DEPLOYPATH/Kaizen-Chat/

    # Union Regional Festival invitation microsite
    - /bin/mkdir -p $DEPLOYPATH/Invitations
    - /bin/cp Invitations/index.html $DEPLOYPATH/Invitations/
    - /bin/cp "Invitations/regional festival logo.png" $DEPLOYPATH/Invitations/
    - /bin/cp Invitations/regional-festival-logo.webp $DEPLOYPATH/Invitations/
    - /bin/cp Invitations/union-festival-hero.webp $DEPLOYPATH/Invitations/
    - /bin/cp Invitations/unionboda.jpg $DEPLOYPATH/Invitations/
    - /bin/cp Invitations/Union_logo_reversed.png $DEPLOYPATH/Invitations/

    - /bin/cp *.webp $DEPLOYPATH
    - /bin/cp *.png $DEPLOYPATH
    - /bin/cp *.jpg $DEPLOYPATH
